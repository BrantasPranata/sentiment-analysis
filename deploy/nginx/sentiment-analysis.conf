# Potongan konfigurasi untuk nginx server (reverse proxy) di dalam blok "server { ... }".
# Menggantikan konfigurasi lama (fastcgi_pass sentimentfe:9000).
#
# Dashboard dapat diakses di https://<domain>/sentiment-analysis/
# Set APP_URL=https://<domain>/sentiment-analysis di .env agar URL API di dashboard ikut benar.

location = /sentiment-analysis {
    return 301 /sentiment-analysis/;
}

location ^~ /sentiment-analysis/ {
    client_max_body_size 20M;

    # Garis miring di akhir: prefix /sentiment-analysis dibuang sebelum diteruskan
    # (container frontend ikut network proxy lewat docker-compose.prod.yml)
    proxy_pass http://sentiment-frontend:8080/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix /sentiment-analysis;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
