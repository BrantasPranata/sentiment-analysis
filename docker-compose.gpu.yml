# Override untuk server GPU (NVIDIA): pipeline memakai PyTorch CUDA & mendapat akses GPU.
# Syarat di server: driver NVIDIA + NVIDIA Container Toolkit (cek: docker run --rm --gpus all ubuntu nvidia-smi).
#
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.gpu.yml up -d
#
# Sesuaikan TORCH_INDEX_URL dengan versi CUDA driver server (lihat https://pytorch.org/get-started/locally/).

services:
  pipeline:
    build:
      context: ./pipeline
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
